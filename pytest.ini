[pytest]
# Network tests are deselected by default so the suite stays fast and can never
# fail because Yahoo is having a bad afternoon. Run them deliberately with
# `pytest -m network` to check that recorded fixtures still match live
# responses -- that is how an upstream shape change gets noticed on purpose
# rather than in production.
addopts = -m "not network"
markers =
    network: hits a live provider; excluded from the default run
